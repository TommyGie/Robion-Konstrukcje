<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROBION · przegląd modeli PP-R</title><style>body{font:15px system-ui;background:#edf1f3;color:#314653;margin:25px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px}p{color:#60717b}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{background:white;border:1px solid #dce3e6;border-radius:16px;overflow:hidden;text-align:center}canvas{width:100%;height:220px;display:block}h2{font-size:15px;margin:0 0 14px}a{color:#326075}@media(max-width:800px){main{grid-template-columns:repeat(2,1fr)}}</style><header><h1>ROBION · PP-R — przegląd modeli</h1><a href="../hydro.html">Wróć do edytora</a></header><p>Zwarte korpusy, kielichy bez wystających kołnierzy i otwarte kanały. Modele poglądowe Ø 32 mm, redukcja 32/20.</p><main id="parts"></main><script type="module">
import * as T from '../vendor/three.module.js';import {element} from './model.js';import {PPR_PARTS} from './ppr.js';import {pprMesh} from './ppr-view.js';
const renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(500,360);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;
for(const [key,part] of Object.entries(PPR_PARTS)){const article=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=500;canvas.height=360;const name=document.createElement('h2');name.textContent=part.name;article.append(canvas,name);document.getElementById('parts').append(article);const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x62707a,2.3));const light=new T.DirectionalLight(0xffffff,3);light.position.set(-120,180,160);scene.add(light);const e=element(key,[0,0,0],32,20);if(e.kind==='pipe')e.geometry.length=110;const mesh=pprMesh(e);scene.add(mesh);const box=new T.Box3().setFromObject(mesh),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3()).length(),camera=new T.PerspectiveCamera(34,500/360,.1,10000);camera.position.copy(center).add(new T.Vector3(-1,1.2,1.7).normalize().multiplyScalar(size*1.8));camera.lookAt(center);renderer.render(scene,camera);canvas.getContext('2d').drawImage(renderer.domElement,0,0);mesh.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});}renderer.dispose();
</script></html>
